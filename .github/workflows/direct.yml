# Direct-download release: universal aturfile.app signed with Developer ID,
# notarised, published as a GitHub Release with the signed update manifest
# the in-app updater reads (crates/af-update). Push a tag that matches
# [workspace.package] version in Cargo.toml:
#   git tag -a v1.1.0 -m "aturfile 1.1.0" && git push origin v1.1.0
#
# Dry run (builds, signs, notarises; workflow artifacts only, no release):
#   gh workflow run direct.yml --ref main
#
# Runs in the `release` environment (DEVELOPER_ID_P12_*, ASC_*, UPDATE_SIGNING_KEY),
# which only main and v* tags may use. Steps: docs/release.md.
name: Direct release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and notarise, but upload workflow artifacts only (no GitHub Release)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    environment: release
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == "refs/tags/v$version" ]] \
              || { echo "::error::publishing needs tag v$version (Cargo.toml), got $GITHUB_REF"; exit 1; }
          fi

      # Fail now rather than after notarising.
      - name: Update signing key is set
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: '[ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::secret UPDATE_SIGNING_KEY is missing from the release environment"; exit 1; }'

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: direct-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          restore-keys: |
            direct-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            direct-macos-
            store-macos-

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Signing keychain and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: scripts/ci-keychain.sh setup DEVELOPER_ID

      - name: Build (universal)
        run: scripts/build-direct.sh bundle dist

      - name: Sign and notarise
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          scripts/build-direct.sh sign dist/aturfile.app
          scripts/build-direct.sh notarize dist/aturfile.app

      - name: Smoke test
        run: |
          set -euo pipefail
          bin=dist/aturfile.app/Contents/MacOS/aturfile
          lipo -archs "$bin"
          out="$("$bin" --version)"
          echo "$out"
          [[ "$out" == "aturfile $VERSION" ]] || { echo "::error::--version says '$out', expected 'aturfile $VERSION'"; exit 1; }
          arch -x86_64 "$bin" --version || echo "::warning::could not run the x86_64 slice (no Rosetta?)"
          codesign -d --verbose=2 dist/aturfile.app 2>&1 | grep -q '^TeamIdentifier=F6Q6UFUK69$'

      - name: Package
        run: |
          set -euo pipefail
          scripts/build-direct.sh package dist/aturfile.app dist
          (cd dist && shasum -a 256 aturfile-*.tar.gz aturfile-*.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Update manifest (signed)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # macOS ships LibreSSL; the script needs OpenSSL 3 for Ed25519.
          export OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          [[ -x "$OPENSSL" ]] || { brew install openssl@3 && OPENSSL="$(brew --prefix openssl@3)/bin/openssl"; }
          tag="v${VERSION}"
          scripts/update-manifest.sh "$VERSION" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            dist/update-stable.json \
            "dist/aturfile-${VERSION}-universal-macos.tar.gz"

      - name: Remove keychain and notary key
        if: always()
        run: scripts/ci-keychain.sh cleanup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aturfile-direct-${{ env.VERSION }}
          path: |
            dist/aturfile-*.tar.gz
            dist/aturfile-*.zip
            dist/SHA256SUMS
            dist/update-stable.json
            dist/update-stable.json.sig
          if-no-files-found: error

      # The manifest goes up last, so it never points at assets that aren't there yet.
      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          cat > notes.md <<EOF
          aturfile ${VERSION} for macOS 13 or later (Apple silicon and Intel), signed and notarised.

          Download [aturfile-${VERSION}-macos.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/aturfile-${VERSION}-macos.zip), unzip it and move aturfile to Applications. It checks for updates once a day and installs them when you restart it.
          EOF
          gh release create "$tag" "dist/aturfile-${VERSION}-macos.zip" \
            "dist/aturfile-${VERSION}-universal-macos.tar.gz" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "aturfile ${VERSION}" --notes-file notes.md
          gh release upload "$tag" dist/update-stable.json dist/update-stable.json.sig \
            --repo "$GITHUB_REPOSITORY"
