# Every push: the engines on Linux, the app on macOS (lint, test, release
# build, two unsigned bundles, and a launch smoke test with screenshots).
# No secrets: safe for forks. Nothing is built on developer machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: engines-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            engines-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            engines-linux-

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --keep-going -p af-fs -p af-mac -p af-clean -p af-search -p af-store -p af-update --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked -p af-fs -p af-mac -p af-clean -p af-search -p af-store -p af-update

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Saved after failed lints too, so the next push doesn't rebuild GPUI.
        if: ${{ !cancelled() }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            app-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            app-macos-

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Lint
        run: cargo clippy --locked --keep-going --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace

      - name: Build release
        if: ${{ !cancelled() }}
        run: cargo build --locked --release -p af-app

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Saved after failed lints too, so the next push doesn't rebuild GPUI.
        if: ${{ !cancelled() }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Plain build, and the same binary signed ad hoc with the App Store
      # sandbox entitlements to try the folder-grant flow.
      - name: Bundle
        if: ${{ !cancelled() }}
        run: |
          scripts/bundle-macos.sh target/release/aturfile dist
          mkdir -p dist-sandboxed
          scripts/bundle-macos.sh target/release/aturfile dist-sandboxed packaging/entitlements.mas.plist
          test -f dist/aturfile.app/Contents/Resources/AppIcon.icns || { echo "::error::no AppIcon.icns in the bundle"; exit 1; }
          sips -g pixelWidth dist/aturfile.app/Contents/Resources/AppIcon.icns

      # Launch each bundle in each view, let it render (and scan, in Clean
      # Up), capture its window, and fail if the app died on the way. The
      # fixture folder gives the views and the preview known content.
      - name: Smoke test
        if: ${{ !cancelled() }}
        run: |
          mkdir -p shots
          swiftc -O -o /tmp/window-id scripts/window-id.swift
          fx=/tmp/af-fixture
          rm -rf "$fx" && mkdir -p "$fx/Projects/aturfile/src" "$fx/Projects/kantor" "$fx/Photos" "$fx/Music" "$fx/Archive"
          printf '# Release notes\n\nThe **new** file manager:\n\n- tabs and *three* views\n- a preview pane\n- [Clean Up](https://example.com)\n\n```rust\nfn main() {}\n```\n' > "$fx/README.md"
          cp crates/af-fs/src/lib.rs "$fx/Projects/aturfile/src/lib.rs"
          cp Cargo.toml "$fx/Projects/aturfile/Cargo.toml"
          printf 'Groceries\n- coffee\n- rice\n' > "$fx/notes.txt"
          head -c 3000000 /dev/urandom > "$fx/Archive/backup.zip"
          head -c 120000 /dev/urandom > "$fx/Music/track.mp3"
          for f in /System/Library/Desktop\ Pictures/*.heic; do
            sips -s format jpeg -Z 1200 "$f" --out "$fx/Photos/$(basename "$f" .heic).jpg" >/dev/null 2>&1 || true
          done
          ls /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/*.icns | head -6 | while read -r icns; do
            sips -s format png -Z 256 "$icns" --out "$fx/Photos/$(basename "$icns" .icns).png" >/dev/null 2>&1 || true
          done
          ls -la "$fx" "$fx/Photos" | head -40
          smoke() {
            local name="$1" wait="$2"; shift 2
            "$@" > "shots/$name.log" 2>&1 &
            local pid=$! id=""
            for _ in $(seq 1 60); do
              if id="$(/tmp/window-id "$pid" 2>/dev/null)"; then break; fi
              sleep 0.5
            done
            [ -n "$id" ] || { echo "::error::$name: no window appeared"; cat "shots/$name.log"; return 1; }
            sleep "$wait"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::$name exited early"; cat "shots/$name.log"; return 1
            fi
            screencapture -o -x -l "$id" "shots/$name.png"
            echo "== $name"; cat "shots/$name.log"
            kill "$pid"
          }
          export AF_DEBUG=1
          app=dist/aturfile.app/Contents/MacOS/aturfile
          smoke files 8 "$app"
          smoke oversized 6 "$app" --window 1440x900
          smoke list-preview 8 "$app" --preview --select README.md "$fx"
          smoke dark 8 "$app" --theme "aturfile Dark" --preview --select README.md "$fx"
          smoke columns 8 "$app" --view columns --select aturfile "$fx/Projects"
          smoke columns-file 8 "$app" --view columns --select Cargo.toml "$fx/Projects/aturfile"
          smoke icons 10 "$app" --view icons --preview "$fx/Photos"
          smoke code-preview 8 "$app" --preview --select lib.rs "$fx/Projects/aturfile/src"
          smoke light 8 "$app" --theme "aturfile Light" --preview --select notes.txt "$fx"
          smoke airy-nord 8 "$app" --theme Nord --density airy --view icons "$fx"
          smoke palette 6 "$app" --palette "$fx"
          smoke search 8 "$app" --search "report" "$fx"
          smoke about 5 "$app" --sheet about "$fx"
          # A file created after launch must appear without a reload.
          mkdir -p "$fx/Live" && echo old > "$fx/Live/before.txt"
          (sleep 5; echo new > "$fx/Live/appeared-while-open.txt") &
          smoke live 9 "$app" --select before.txt "$fx/Live"
          smoke cleanup 20 "$app" --cleanup --theme "aturfile Dark"
          AF_SCAN_ROOT="$fx" smoke cleanup-light 10 "$app" --cleanup --theme "aturfile Light"
          smoke sandboxed 8 dist-sandboxed/aturfile.app/Contents/MacOS/aturfile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-screenshots
          path: shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aturfile-macos
          path: |
            dist/*.zip
            dist-sandboxed/*.zip
          if-no-files-found: error

  # The Mac App Store variant: `store` feature (StoreKit 2 Pro unlock),
  # universal, sandboxed, signed ad hoc. No secrets; signing and upload are
  # scripts/build-mas.sh package (docs/release.md).
  store:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: store-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            store-macos-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            store-macos-

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Lint
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo clippy --locked --keep-going -p af-store -p af-app --all-targets --features af-app/store -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo test --locked -p af-store -p af-app --features af-app/store

      - name: Bundle (universal, unsigned)
        if: ${{ !cancelled() }}
        run: scripts/build-mas.sh bundle dist-store

      # App Review rejects private AppKit API. These are the selectors upstream
      # GPUI used (patched out in vendor/gpui-pre-macos) and the CGS blur call.
      - name: No private API
        if: ${{ !cancelled() }}
        run: |
          bin=dist-store/aturfile.app/Contents/MacOS/aturfile
          if strings -a "$bin" | grep -E '_windowResize(NorthWest|NorthEast)|_zoomFill|_opaqueRectForWindowMove|_windowRestorationOptions|NSWindowRestorationOptions|CGSSetWindowBackgroundBlurRadius'; then
            echo "::error::private AppKit API in the store build (see vendor/gpui-pre-macos/PATCHES.md)"
            exit 1
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The store build launches (StoreKit can't answer on CI) and shows the
      # Pro sheet; the bundle has its icon and the sandbox entitlement.
      - name: Smoke test
        if: ${{ !cancelled() }}
        run: |
          app=dist-store/aturfile.app
          test -f "$app/Contents/Resources/AppIcon.icns"
          codesign -d --entitlements - "$app" | grep -q app-sandbox
          lipo -archs "$app/Contents/MacOS/aturfile"
          mkdir -p shots
          swiftc -O -o /tmp/window-id scripts/window-id.swift
          "$app/Contents/MacOS/aturfile" --sheet pro > shots/store-pro.log 2>&1 &
          pid=$! id=""
          for _ in $(seq 1 60); do
            if id="$(/tmp/window-id "$pid" 2>/dev/null)"; then break; fi
            sleep 0.5
          done
          [ -n "$id" ] || { echo "::error::no window"; cat shots/store-pro.log; exit 1; }
          sleep 6
          kill -0 "$pid" || { echo "::error::store build exited early"; cat shots/store-pro.log; exit 1; }
          screencapture -o -x -l "$id" shots/store-pro.png
          cat shots/store-pro.log
          kill "$pid"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: store-screenshots
          path: shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aturfile-mas-unsigned
          path: dist-store/*-mas-unsigned.zip
          if-no-files-found: error
