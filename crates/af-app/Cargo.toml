[package]
name = "af-app"
description = "aturfile: a fast file manager with disk cleanup, in GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aturfile"
path = "src/main.rs"

[dependencies]
af-fs = { path = "../af-fs" }
af-clean = { path = "../af-clean" }
af-mac = { path = "../af-mac" }
af-ui = { path = "../af-ui" }
af-search = { path = "../af-search" }
# Syntax highlighting in the code preview: tree-sitter grammars for a few
# common languages only (JSON comes with the base feature).
gpui-kit = { workspace = true, features = [
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-python",
    "tree-sitter-bash",
    "tree-sitter-yaml",
] }
serde.workspace = true
toml.workspace = true
chrono.workspace = true
notify = "8"
async-channel = "2"

[dev-dependencies]
tempfile.workspace = true
