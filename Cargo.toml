[workspace]
resolver = "3"
members = ["crates/af-fs", "crates/af-mac", "crates/af-clean", "crates/af-app"]
# The GPUI app needs a display; `cargo test` at the root covers the engines.
default-members = ["crates/af-fs", "crates/af-mac", "crates/af-clean"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
plist = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
libc = "0.2"
parking_lot = "0.12"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

# gpui 0.2.2 plus Metal fixes and without the private blur API App Review
# rejects: the VoltrusID fork (Apache-2.0), shared with Voltrus Tools.
[patch.crates-io]
gpui = { git = "https://github.com/VoltrusID/gpui", rev = "006435b1298bba807375568f8a75c1bcb025a8de" }
