[workspace]
resolver = "3"
members = [
    "crates/af-fs",
    "crates/af-mac",
    "crates/af-clean",
    "crates/af-ui",
    "crates/af-app",
]
# The GPUI app needs a display; `cargo test` at the root covers the engines.
default-members = ["crates/af-fs", "crates/af-mac", "crates/af-clean"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
plist = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
libc = "0.2"
parking_lot = "0.12"
tempfile = "3"
toml = "0.9"
# UI: gpui-kit pins the matching GPUI release (published as gpui-pre-*),
# gpui-component widgets and the Lucide icon set, and re-exports them.
gpui-kit = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
